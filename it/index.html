.mbox{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#1a130d;border:1px solid rgba(232,200,140,.28);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));color:#efe2c8;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
